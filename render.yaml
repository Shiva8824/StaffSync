services:
  # StaffSync All-in-One Web Service (Full Stack MERN)
  - type: web
    name: staffsync-hrms
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false # Prompts user for MongoDB Atlas connection URI during deployment
